<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅費分帳</title>
<meta name="theme-color" content="#c2410c">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1b16; --muted:#6b6259; --line:#e7e0d6;
  --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fdeee5;
  --good:#15803d; --good-soft:#e7f5ec; --bad:#b91c1c; --bad-soft:#fbeaea;
  --shadow:0 1px 2px rgba(31,27,22,.06),0 4px 14px rgba(31,27,22,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --card:#211d18; --ink:#f3ede5; --muted:#a89e92; --line:#38312a;
    --accent:#fb923c; --accent-ink:#1a120b; --accent-soft:#3a2416;
    --good:#4ade80; --good-soft:#15291c; --bad:#f87171; --bad-soft:#341a1a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --card:#211d18; --ink:#f3ede5; --muted:#a89e92; --line:#38312a;
  --accent:#fb923c; --accent-ink:#1a120b; --accent-soft:#3a2416;
  --good:#4ade80; --good-soft:#15291c; --bad:#f87171; --bad-soft:#341a1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{line-height:1.25;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.demo{background:#fde68a;color:#422006;font-size:14px;padding:8px 16px;text-align:center}
.hero{padding:40px 0 20px}
.hero h1{font-size:30px}
.hero p{color:var(--muted);margin:8px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:14px 0}
.card h2{font-size:18px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
label>input,label>select{display:block;width:100%;margin-top:4px}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
fieldset{border:0;padding:0;margin:14px 0 0}
legend{font-size:14px;color:var(--muted);padding:0;margin-bottom:6px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 18px;font-weight:600}
.primary:disabled{opacity:.6}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.link{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:600}
.danger{background:var(--bad-soft);color:var(--bad);border:0;border-radius:12px;padding:12px 16px;font-weight:600}
.block{width:100%;margin-top:18px}
.member-row{display:flex;gap:8px;margin-bottom:8px}
.member-row input{flex:1}
.member-row button{flex:0 0 auto;width:44px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline input{width:120px}
.recent a{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.recent a:first-of-type{border-top:0}
.recent span{color:var(--muted);font-size:14px}

.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.back{font-size:30px;line-height:1;color:var(--muted);text-decoration:none;padding:0 6px 4px 0}
.titles{flex:1;min-width:0}
.titles h1{font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.whoami{margin:6px 0 4px;display:flex;align-items:center;gap:10px}
.whoami label{margin:0;color:var(--muted);flex:0 0 auto}
.whoami select{width:auto;flex:1;padding:8px 10px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0;position:sticky;top:8px;z-index:5;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:4px 0 8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .t{font-size:13px;color:var(--muted)}
.day{font-size:13px;color:var(--muted);margin:18px 2px 6px;font-weight:600}
.exp{display:flex;width:100%;text-align:left;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;align-items:center}
.exp .l{flex:1;min-width:0}
.exp .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .l span,.exp .r span{font-size:13px;color:var(--muted)}
.exp .r{text-align:right;font-variant-numeric:tabular-nums}
.exp .r b{display:block}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big{font-size:40px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 28px;font-size:17px;font-weight:700;box-shadow:0 6px 20px rgba(194,65,12,.35);z-index:10}

.bal{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.bal:first-of-type{border-top:0}
.bal .n{flex:1;min-width:0}
.bal .n b{display:block}
.bal .n span{font-size:13px;color:var(--muted)}
.bal .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bal .amt span{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tx{display:flex;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--accent-soft);margin-bottom:8px}
.tx .who{flex:1;min-width:0}
.tx .arrow{color:var(--muted);margin:0 4px}
.tx .amt{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tx .amt span{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.sharebox{display:flex;gap:8px}
.sharebox input{flex:1;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;margin:0;color:var(--ink);font-size:15px;background:var(--bg)}
.chip input{width:auto;margin:0;accent-color:var(--accent)}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg label{margin:0;padding:10px 14px;color:var(--muted);font-weight:600;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:flex-end}
.row .grow{flex:1}
.custom-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.custom-row span{flex:0 0 30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-row input{flex:1}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.hint.warn{color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:10px 0 0}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.actions .spacer{flex:1}
.actions button[data-act="cancel"]{background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 16px}

dialog{border:0;padding:0;background:transparent;color:var(--ink);width:100%;max-width:560px;max-height:100dvh;margin:auto auto 0}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
@media (min-width:600px){dialog{margin:auto} dialog form{border-radius:20px}}
dialog h2{font-size:20px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.center{text-align:center;padding:60px 10px;color:var(--muted)}
</style>
</head>
<body>
<div id="demoBanner" class="demo" hidden>示範模式：還沒接上雲端資料庫，重新整理後資料會消失。</div>
<div id="app"><p class="center">載入中…</p></div>
<dialog id="expDlg"><form id="expForm" method="dialog" novalidate></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
